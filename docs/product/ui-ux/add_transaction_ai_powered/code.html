<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay Background -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Add Transaction Modal -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-[600px] z-50 overflow-hidden flex flex-col max-h-[921px]">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
<h2 class="font-headline-md text-headline-md text-primary">Add Transaction</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-full hover:bg-surface-container-highest">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto p-lg flex flex-col gap-lg">
<!-- AI Scan Action -->
<button class="w-full flex items-center justify-center gap-sm bg-primary-container text-on-primary-container py-md rounded-lg hover:opacity-90 transition-opacity shadow-sm">
<span class="material-symbols-outlined" data-icon="document_scanner">document_scanner</span>
<span class="font-label-md text-label-md font-bold">Scan Receipt (OCR)</span>
</button>
<!-- AI Extraction Review State (Simulated) -->
<div class="bg-secondary-container rounded-lg p-md border border-secondary flex gap-md items-start">
<span class="material-symbols-outlined text-primary mt-1" data-icon="magic_button">magic_button</span>
<div>
<h3 class="font-label-md text-label-md font-bold text-on-secondary-container">Review AI Extraction</h3>
<p class="font-body-md text-body-md text-on-secondary-container mt-xs">We extracted the details below. Please review and confirm.</p>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-md">
<!-- Amount Input -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-md font-headline-md text-headline-md text-primary">$</span>
<input class="w-full pl-[40px] pr-md py-md text-right font-headline-lg text-headline-lg border-2 border-primary rounded-lg bg-surface focus:outline-none focus:ring-4 focus:ring-primary/20 text-on-surface transition-all" type="text" value="45.50"/>
<!-- AI Highlight Indicator -->
<div class="absolute -right-2 -top-2 bg-primary text-on-primary rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- Category -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Category</label>
<div class="grid grid-cols-4 gap-sm">
<button class="flex flex-col items-center justify-center p-sm rounded-lg border-2 border-primary bg-secondary-container text-on-secondary-container transition-all">
<span class="material-symbols-outlined mb-xs" data-icon="restaurant">restaurant</span>
<span class="font-label-sm text-label-sm">Dining</span>
</button>
<button class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-highest transition-all text-on-surface-variant">
<span class="material-symbols-outlined mb-xs" data-icon="local_gas_station">local_gas_station</span>
<span class="font-label-sm text-label-sm">Fuel</span>
</button>
<button class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-highest transition-all text-on-surface-variant">
<span class="material-symbols-outlined mb-xs" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Groceries</span>
</button>
<button class="flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-highest transition-all text-on-surface-variant">
<span class="material-symbols-outlined mb-xs" data-icon="more_horiz">more_horiz</span>
<span class="font-label-sm text-label-sm">Other</span>
</button>
</div>
</div>
<!-- Note & Date Grid -->
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Note</label>
<div class="relative">
<input class="w-full px-md py-sm font-body-md text-body-md border-2 border-primary rounded-lg bg-surface focus:outline-none focus:ring-4 focus:ring-primary/20 text-on-surface transition-all" type="text" value="Lunch with Client"/>
<div class="absolute -right-2 -top-2 bg-primary text-on-primary rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined text-[12px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Date</label>
<input class="w-full px-md py-sm font-body-md text-body-md border border-outline-variant rounded-lg bg-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 text-on-surface transition-all" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Wallet Selection -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Wallet</label>
<select class="w-full px-md py-sm font-body-md text-body-md border border-outline-variant rounded-lg bg-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 text-on-surface transition-all appearance-none">
<option>Main Checking (...1234)</option>
<option>Credit Card (...5678)</option>
<option>Cash</option>
</select>
</div>
</div>
<!-- Integrated Calculator/Keyboard (Mobile optimized view, embedded here for desktop preview) -->
<div class="bg-surface-container rounded-lg p-sm grid grid-cols-4 gap-xs mt-md">
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">7</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">8</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">9</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">4</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">5</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">6</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface-variant hover:bg-surface-container-highest transition-colors">-</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">1</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">2</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">3</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface-variant hover:bg-surface-container-highest transition-colors">+</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors col-span-2">0</button>
<button class="bg-surface py-md rounded text-center font-headline-md text-on-surface hover:bg-surface-container-highest transition-colors">.</button>
<button class="bg-primary text-on-primary py-md rounded text-center font-headline-md hover:bg-primary-container transition-colors">=</button>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container-low flex justify-end gap-sm">
<button class="px-lg py-sm font-label-md text-label-md font-bold text-on-surface-variant bg-surface hover:bg-surface-container-highest rounded-lg transition-colors border border-outline-variant">Cancel</button>
<button class="px-lg py-sm font-label-md text-label-md font-bold text-on-primary bg-primary hover:opacity-90 rounded-lg transition-opacity shadow-sm flex items-center gap-xs">
<span>Confirm &amp; Save</span>
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</div>
